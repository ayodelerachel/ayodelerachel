<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Anton;src:url(fonts/anton.woff2)}
@font-face{font-family:Cinzel;src:url(fonts/cinzel-900.ttf);font-weight:900}
@font-face{font-family:Corm;src:url(fonts/cormorant-it.ttf);font-style:italic;font-weight:600}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;background:#070a24}
.c{position:relative;width:1280px;height:720px;overflow:hidden;
 background:radial-gradient(ellipse 760px 620px at 1030px 120px,#fff6dc 0%,#f3d9a0 9%,#9f8fd8 28%,#3b3a9a 52%,#141a55 75%,#070a24 100%)}
.rays{position:absolute;left:1030px;top:-80px;width:2400px;height:2400px;margin:-1200px 0 0 -1200px;
 background:repeating-conic-gradient(from 90deg,rgba(255,248,225,.16) 0deg 3deg,transparent 3deg 11deg);
 -webkit-mask:radial-gradient(circle,#000 0,#000 12%,transparent 42%);filter:blur(3px)}
.cloud{position:absolute;border-radius:50%;filter:blur(28px)}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 6px #cfd8ff}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,10,36,.94) 0%,rgba(7,10,36,.75) 45%,rgba(7,10,36,0) 66%)}
svg{position:absolute;left:0;top:0}
.txt{position:absolute;left:56px;top:70px;width:820px;white-space:nowrap;text-align:left}
.head{font-family:Anton;text-transform:uppercase;font-size:142px;line-height:1.0;letter-spacing:1px;color:#fffaf0;
 text-shadow:0 5px 0 #0a0c2e,0 0 30px rgba(10,12,46,.9)}
.head .g{background:linear-gradient(180deg,#fffbea 0%,#ffe08a 45%,#e0a43c 100%);-webkit-background-clip:text;color:transparent;
 text-shadow:none;filter:drop-shadow(0 5px 0 #0a0c2e) drop-shadow(0 0 22px rgba(255,210,120,.6))}
.pray{margin-top:22px;display:flex;align-items:center;gap:20px;width:600px}
.pray:before,.pray:after{content:"";flex:1;height:2px;background:linear-gradient(90deg,transparent,#e9c77a,transparent)}
.pray span{font-family:Cinzel;font-weight:900;font-size:62px;letter-spacing:6px;
 background:linear-gradient(180deg,#fffbea,#e9b95a);-webkit-background-clip:text;color:transparent;
 filter:drop-shadow(0 3px 0 #2a1d08) drop-shadow(0 0 18px rgba(255,214,130,.6))}
</style></head><body><div class="c">
<div class="rays"></div>
<div class="cloud" style="left:620px;top:250px;width:520px;height:120px;background:rgba(214,200,255,.45)"></div>
<div class="cloud" style="left:960px;top:200px;width:420px;height:110px;background:rgba(255,236,210,.5)"></div>
<div class="cloud" style="left:760px;top:60px;width:340px;height:90px;background:rgba(255,250,235,.55)"></div>
<div class="star" style="left:120px;top:40px"></div><div class="star" style="left:300px;top:24px"></div>
<div class="star" style="left:520px;top:48px;width:2px;height:2px"></div><div class="star" style="left:40px;top:300px;width:2px;height:2px"></div>
<div class="star" style="left:600px;top:150px;width:2px;height:2px"></div><div class="star" style="left:1220px;top:520px;width:2px;height:2px"></div>
<div class="shade"></div>
<svg width="1280" height="720" viewBox="0 0 1280 720">
 <defs>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff4cf" stop-opacity=".95"/><stop offset=".4" stop-color="#ffd98a" stop-opacity=".45"/><stop offset="1" stop-color="#ffd98a" stop-opacity="0"/></radialGradient>
  <linearGradient id="cr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#ffe9b0"/><stop offset="1" stop-color="#e2b25a"/></linearGradient>
  <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1d52"/><stop offset="1" stop-color="#05071a"/></linearGradient>
  <filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
 </defs>
 <ellipse cx="1060" cy="330" rx="260" ry="260" fill="url(#glow)"/>
 <path d="M0 720 L0 640 C220 610 420 650 620 600 C760 560 860 520 960 515 C1080 512 1180 560 1280 590 L1280 720 Z" fill="url(#hill)"/>
 <path d="M620 600 C760 560 860 520 960 515 C1080 512 1180 560 1280 590" fill="none" stroke="#ffe0a0" stroke-opacity=".55" stroke-width="3" filter="url(#b)"/>
 <g filter="url(#b)" opacity=".9"><rect x="1044" y="160" width="32" height="360" fill="#ffe7a8"/><rect x="980" y="240" width="160" height="30" fill="#ffe7a8"/></g>
 <rect x="1046" y="162" width="28" height="356" rx="3" fill="url(#cr)"/>
 <rect x="984" y="242" width="152" height="26" rx="3" fill="url(#cr)"/>
</svg>
<div class="txt">
 <div class="head">Working Hard<br>But Still<br><span class="g">Broke?</span></div>
 <div class="pray"><span>PRAY THIS</span></div>
</div>
</div></body></html>
